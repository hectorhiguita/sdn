<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMware NSX — Zero Trust y Microsegmentación</title>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #3b82f6;
    --accent2: #06b6d4;
    --accent3: #8b5cf6;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --text3: #64748b;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ── TOP BAR ── */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 52px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 16px;
  }
  #topbar .brand { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .05em; white-space: nowrap; }
  #topbar .title-bar { font-size: 13px; color: var(--text2); flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .controls { display: flex; align-items: center; gap: 8px; }
  .btn-icon {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
    width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .btn-icon:hover { background: var(--border); color: var(--text); }
  #slide-counter { font-size: 12px; color: var(--text3); min-width: 52px; text-align: center; }

  /* ── MAIN AREA ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 220px; background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0; transition: width .25s; padding: 8px 0;
  }
  #sidebar.collapsed { width: 0; padding: 0; overflow: hidden; }
  .sidebar-section { padding: 6px 12px 2px; font-size: 10px; font-weight: 700;
    color: var(--text3); letter-spacing: .1em; text-transform: uppercase; }
  .thumb {
    display: flex; align-items: center; gap: 10px; padding: 7px 12px;
    cursor: pointer; border-left: 3px solid transparent; transition: all .15s;
    font-size: 12px; color: var(--text2);
  }
  .thumb:hover { background: var(--surface2); color: var(--text); }
  .thumb.active { border-left-color: var(--accent); background: var(--surface2); color: var(--text); }
  .thumb-num { font-size: 10px; color: var(--text3); min-width: 18px; }
  .thumb-label { line-height: 1.3; }

  /* ── SLIDE STAGE ── */
  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow: hidden; position: relative;
  }
  .slide {
    display: none; width: 100%; max-width: 960px; max-height: calc(100vh - 120px);
    aspect-ratio: 16/9; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; position: relative;
    box-shadow: 0 25px 60px rgba(0,0,0,.5);
  }
  .slide.active { display: flex; flex-direction: column; }

  /* ── SLIDE INNER ── */
  .slide-inner {
    flex: 1; padding: 40px 48px; display: flex; flex-direction: column;
    justify-content: center; overflow: hidden;
  }
  .slide-inner.pad-sm { padding: 28px 40px; }

  /* ── SLIDE FOOTER ── */
  .slide-footer {
    padding: 10px 48px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; color: var(--text3); flex-shrink: 0;
  }
  .exp-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
    letter-spacing: .05em;
  }
  .exp1 { background: rgba(59,130,246,.15); color: var(--accent); }
  .exp2 { background: rgba(139,92,246,.15); color: var(--accent3); }
  .exp3 { background: rgba(16,185,129,.15); color: var(--green); }

  /* ── TYPOGRAPHY ── */
  .slide-tag { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px; }
  .slide-tag.purple { color: var(--accent3); }
  .slide-tag.green { color: var(--green); }
  h1.hero { font-size: clamp(22px, 3.5vw, 42px); font-weight: 800; line-height: 1.15; }
  h2.title { font-size: clamp(16px, 2.5vw, 28px); font-weight: 700; line-height: 1.2; }
  h3.subtitle { font-size: clamp(13px, 1.8vw, 20px); font-weight: 600; color: var(--text2); }
  p.body { font-size: clamp(11px, 1.3vw, 15px); color: var(--text2); line-height: 1.65; }
  .accent-line { width: 48px; height: 3px; border-radius: 2px; background: var(--accent); margin: 14px 0; }
  .accent-line.purple { background: var(--accent3); }
  .accent-line.green { background: var(--green); }

  /* ── GRID HELPERS ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

  /* ── CARDS ── */
  .card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; font-size: clamp(10px, 1.1vw, 13px);
  }
  .card .card-title { font-weight: 700; margin-bottom: 6px; font-size: clamp(11px, 1.2vw, 14px); }
  .card .card-body { color: var(--text2); line-height: 1.5; }
  .card.accent-border { border-left: 3px solid var(--accent); }
  .card.purple-border { border-left: 3px solid var(--accent3); }
  .card.green-border { border-left: 3px solid var(--green); }
  .card.yellow-border { border-left: 3px solid var(--yellow); }

  /* ── TIMELINE ── */
  .timeline { display: flex; gap: 0; align-items: stretch; }
  .tl-item { flex: 1; position: relative; padding: 14px 16px 14px 20px; }
  .tl-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--border); }
  .tl-item.active-tl::before { background: var(--accent); }
  .tl-year { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .tl-text { font-size: clamp(10px, 1vw, 12px); color: var(--text2); line-height: 1.4; }

  /* ── COMPARE TABLE ── */
  .compare-table { width: 100%; border-collapse: collapse; font-size: clamp(9px, 1vw, 12px); }
  .compare-table th { padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 700;
    letter-spacing: .05em; border-bottom: 2px solid var(--border); }
  .compare-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: top; }
  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table .col-bad { color: #f87171; }
  .compare-table .col-good { color: var(--green); }
  .compare-table .col-label { color: var(--text); font-weight: 600; }
  .th-bad { color: var(--red) !important; }
  .th-good { color: var(--green) !important; }

  /* ── FIREWALL RULE TABLE ── */
  .fw-table { width: 100%; border-collapse: collapse; font-size: clamp(9px, 1vw, 12px); }
  .fw-table th { padding: 7px 10px; text-align: left; font-size: 10px; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text3); border-bottom: 1px solid var(--border); }
  .fw-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text2); }
  .fw-table tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
  .badge-allow { background: rgba(16,185,129,.15); color: var(--green); }
  .badge-deny { background: rgba(239,68,68,.15); color: var(--red); }

  /* ── ARCH DIAGRAM ── */
  .arch-box {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; text-align: center; font-size: clamp(9px, 1vw, 12px);
  }
  .arch-box .arch-label { font-weight: 700; margin-bottom: 3px; }
  .arch-box .arch-sub { color: var(--text3); font-size: clamp(8px, .9vw, 11px); }
  .arch-arrow { display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 18px; }
  .vm-row { display: flex; gap: 8px; }
  .vm-chip {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; text-align: center; font-size: clamp(8px, .9vw, 11px);
  }
  .vm-chip .vm-name { font-weight: 700; margin-bottom: 2px; }
  .vm-chip .vm-dfw { font-size: 9px; color: var(--accent); }

  /* ── STEP FLOW ── */
  .step-flow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .step-card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; position: relative;
  }
  .step-num { font-size: 10px; font-weight: 700; letter-spacing: .08em; margin-bottom: 6px; }
  .step-title { font-size: clamp(11px, 1.2vw, 14px); font-weight: 700; margin-bottom: 5px; }
  .step-body { font-size: clamp(9px, 1vw, 12px); color: var(--text2); line-height: 1.5; }
  .step-card.danger { border-left: 3px solid var(--red); }
  .step-card.warning { border-left: 3px solid var(--yellow); }
  .step-card.info { border-left: 3px solid var(--accent); }
  .step-card.success { border-left: 3px solid var(--green); }

  /* ── GLOSSARY ── */
  .gloss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  .gloss-item { display: flex; gap: 10px; align-items: baseline; font-size: clamp(9px, 1vw, 12px); padding: 4px 0; border-bottom: 1px solid var(--border); }
  .gloss-term { font-weight: 700; color: var(--accent); min-width: 52px; flex-shrink: 0; }
  .gloss-def { color: var(--text2); line-height: 1.4; }

  /* ── AGENDA ── */
  .agenda-item {
    display: flex; align-items: center; gap: 16px; padding: 14px 18px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  }
  .agenda-num { font-size: 28px; font-weight: 900; line-height: 1; }
  .agenda-content .agenda-title { font-size: clamp(13px, 1.5vw, 17px); font-weight: 700; }
  .agenda-content .agenda-sub { font-size: clamp(10px, 1.1vw, 13px); color: var(--text2); margin-top: 2px; }
  .agenda-time { margin-left: auto; font-size: 12px; color: var(--text3); white-space: nowrap; }

  /* ── SECTION DIVIDER ── */
  .section-slide { background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%); }
  .section-num { font-size: clamp(60px, 10vw, 100px); font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .section-num.purple { background: linear-gradient(135deg, var(--accent3), #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .section-num.green { background: linear-gradient(135deg, var(--green), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  /* ── COVER ── */
  .cover-slide { background: linear-gradient(135deg, #0a0e1a 0%, #0f172a 50%, #0a1628 100%); }
  .cover-slide::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 70% 50%, rgba(59,130,246,.08) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 80%, rgba(139,92,246,.06) 0%, transparent 50%);
  }
  .cover-inner { position: relative; z-index: 1; }
  .cover-tags { display: flex; gap: 8px; margin-bottom: 20px; }
  .cover-tag { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 4px; border: 1px solid; }
  .cover-tag.blue { color: var(--accent); border-color: rgba(59,130,246,.3); background: rgba(59,130,246,.08); }
  .cover-tag.cyan { color: var(--accent2); border-color: rgba(6,182,212,.3); background: rgba(6,182,212,.08); }
  .cover-tag.purple { color: var(--accent3); border-color: rgba(139,92,246,.3); background: rgba(139,92,246,.08); }
  .cover-title { font-size: clamp(28px, 5vw, 56px); font-weight: 900; line-height: 1.1; margin-bottom: 8px; }
  .cover-title span { background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .cover-sub { font-size: clamp(14px, 2vw, 22px); color: var(--text2); margin-bottom: 28px; }
  .cover-meta { display: flex; gap: 24px; flex-wrap: wrap; }
  .cover-meta-item { font-size: 12px; color: var(--text3); }
  .cover-meta-item strong { color: var(--text2); display: block; font-size: 13px; }

  /* ── ZERO TRUST PILLARS ── */
  .zt-pillar {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .zt-icon { font-size: 22px; margin-bottom: 4px; }
  .zt-title { font-size: clamp(12px, 1.3vw, 15px); font-weight: 700; }
  .zt-desc { font-size: clamp(9px, 1vw, 12px); color: var(--text2); line-height: 1.5; }
  .zt-impl { font-size: clamp(8px, .9vw, 11px); color: var(--accent); margin-top: 4px; }

  /* ── TRAFFIC DIAGRAM ── */
  .traffic-diagram { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: clamp(9px, 1vw, 12px); }
  .traffic-row { display: flex; align-items: center; gap: 8px; }
  .traffic-box { padding: 6px 14px; border-radius: 6px; font-weight: 600; text-align: center; white-space: nowrap; }
  .traffic-arrow-v { color: var(--text3); font-size: 16px; }
  .traffic-arrow-h { color: var(--text3); font-size: 14px; flex: 1; text-align: center; }
  .traffic-label { font-size: 10px; color: var(--text3); text-align: center; }

  /* ── INDUSTRY CARDS ── */
  .industry-card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
  }
  .industry-icon { font-size: 20px; margin-bottom: 6px; }
  .industry-title { font-size: clamp(11px, 1.2vw, 14px); font-weight: 700; margin-bottom: 5px; }
  .industry-body { font-size: clamp(9px, 1vw, 12px); color: var(--text2); line-height: 1.5; }

  /* ── PROGRESS BAR ── */
  #progress { height: 2px; background: var(--border); flex-shrink: 0; }
  #progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .3s; }

  /* ── KEYBOARD HINT ── */
  #kbd-hint { position: absolute; bottom: 16px; right: 20px; font-size: 10px; color: var(--text3);
    display: flex; gap: 8px; align-items: center; pointer-events: none; }
  kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 5px; font-size: 10px; font-family: var(--font); }

  /* ── SCROLLBAR ── */
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── PRESENTER NOTES PANEL ── */
  #notes-panel {
    width: 300px; background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0; transition: width .25s;
  }
  #notes-panel.collapsed { width: 0; overflow: hidden; }
  #notes-header { padding: 12px 16px; border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; }
  #notes-content { flex: 1; overflow-y: auto; padding: 16px; font-size: 12px; color: var(--text2); line-height: 1.7; }
  #notes-content::-webkit-scrollbar { width: 4px; }
  #notes-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── FULLSCREEN ── */
  #app.fullscreen #sidebar { display: none; }
  #app.fullscreen #notes-panel { display: none; }
  #app.fullscreen #topbar { display: none; }
  #app.fullscreen #progress { display: none; }
  #app.fullscreen #stage { padding: 0; }
  #app.fullscreen .slide { border-radius: 0; border: none; max-width: 100%; max-height: 100vh; }

  /* ── HIGHLIGHT ── */
  .hl { color: var(--accent); font-weight: 700; }
  .hl-green { color: var(--green); font-weight: 700; }
  .hl-red { color: var(--red); font-weight: 700; }
  .hl-yellow { color: var(--yellow); font-weight: 700; }
  .hl-purple { color: var(--accent3); font-weight: 700; }

  /* ── QUOTE ── */
  .quote-block {
    border-left: 3px solid var(--accent); padding: 10px 16px; margin: 12px 0;
    background: rgba(59,130,246,.05); border-radius: 0 6px 6px 0;
    font-size: clamp(11px, 1.2vw, 14px); color: var(--text2); font-style: italic; line-height: 1.6;
  }

  /* ── VDEFEND BADGE ── */
  .vdefend-badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
    background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3);
    border-radius: 20px; font-size: 11px; font-weight: 700; color: var(--green);
  }

  /* ── CONCLUSION ITEMS ── */
  .conclusion-item {
    display: flex; gap: 14px; align-items: flex-start; padding: 12px 16px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  }
  .conclusion-num { font-size: 22px; font-weight: 900; color: var(--accent); line-height: 1; flex-shrink: 0; }
  .conclusion-text { font-size: clamp(11px, 1.2vw, 14px); color: var(--text2); line-height: 1.55; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    #sidebar { display: none; }
    #notes-panel { display: none; }
    .slide-inner { padding: 20px 24px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .step-flow { grid-template-columns: 1fr; }
    .gloss-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div id="topbar">
    <div class="brand">VMware NSX</div>
    <div class="title-bar" id="slide-title">Portada</div>
    <div class="controls">
      <button class="btn-icon" id="btn-sidebar" title="Panel lateral">☰</button>
      <button class="btn-icon" id="btn-prev" title="Anterior (←)">‹</button>
      <span id="slide-counter">1 / 21</span>
      <button class="btn-icon" id="btn-next" title="Siguiente (→)">›</button>
      <button class="btn-icon" id="btn-notes" title="Notas del expositor">📋</button>
      <button class="btn-icon" id="btn-fs" title="Pantalla completa">⛶</button>
    </div>
  </div>

  <!-- PROGRESS -->
  <div id="progress"><div id="progress-fill"></div></div>

  <!-- MAIN -->
  <div id="main">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-section">Expositor 1 · ~18 min</div>
